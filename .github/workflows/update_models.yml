name: Auto-Update Apple Models & Prices

on:
  schedule:
    # 每天北京时间 10:00 (UTC 02:00) 自动运行一次
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击一键触发

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Apple Official Spec & Price Scraper
        run: |
          python apple_scraper.py --input data/models.json --output data/models.json

      - name: Commit and Push if data changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/models.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-sync Apple lineup specs & prices" && git push)
